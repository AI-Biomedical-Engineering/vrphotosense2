<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>vrphotosense2</title>

	<link rel="stylesheet" type="text/css" href="css/style.css" />
	<link rel="stylesheet" type="text/css" href="css/startScreen.css" />
	<link rel="stylesheet" type="text/css" href="css/stimScreen.css" />
	<link rel="stylesheet" type="text/css" href="css/configScreen.css" />
	<script type="module" src="js/main.js"></script>
</head>
<body>
	<div id="startScreen" class="visible">
		<div id="startBtFrame">
			<button id="startBt" class="action">Start</button>
		</div>
		<div id="configFolderFrame">
			<label>To continue it is required to configure a local folder to save all files related to the app</label>
			<button id="configFolderBt" class="action">Select folder</button>
		</div>
		<div id="connectFrame">
			<label id="connectMsg"></label>
			<button id="cancelConnectBt">Cancel</button>
		</div>
		<div id="askForIdFrame">
			<label>Enter the number shown in the app you want to connect to:</label>
			<input type="number" step="1" name="clientID" placeholder="ID" />
			<button id="connectBt" class="action">Connect</button>
		</div>
	</div>
	<main>
		<div id="stimScreen">
			<div id="topBar">
				<button>Reset VR view</button>
				<button id="configEditorBt">Configs</button>
			</div>
			<div id="eyes">
				<img class="eye" src="" />
				<img class="eye" src="" />
			</div>
			<img id="stream" src="" />
			
			<progress value="0" max="1"></progress>
			<div id="stimControls">
				<button id="skipPrev"><img src="img/controlIcons/skipNext.svg" class="xflipped" /></button>
				<button id="stop"><img src="img/controlIcons/stop.svg" /></button>
				<button id="playPause">
					<img id="playImg" src="img/controlIcons/play.svg" />
					<img id="pauseImg" src="img/controlIcons/pause.svg" />
				</button>
				<button id="skipNext"><img src="img/controlIcons/skipNext.svg" /></button>
				<button id="loopMode"><img src="img/controlIcons/loop.svg" class="invertOnSelected" /></button>
			</div>
			
			<div id="configSelector">
				<div id="configGroups"></div>
				<div id="configNames"></div>
			</div>
		</div>
		
		<div id="configScreen">
			<div id="configControls">
				<button id="uploadBt">Upload</button>
				<button id="saveBt">Save</button>
				<div>
					<button id="saveAsBt">Save as...</button>
					<div id="saveAsNameDialog" class="dialog">
						<input class="dialogInput" type="text" />
					</div>
				</div>
			</div>
			<div id="configTypeSelector"></div>
			<div id="config"></div>
		</div>
	</main>
</body>
</html>
