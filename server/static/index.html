<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>vrphotosense2</title>

	<link rel="stylesheet" type="text/css" href="css/style.css" />
	<link rel="stylesheet" type="text/css" href="css/startScreen.css" />
	<link rel="stylesheet" type="text/css" href="css/stimScreen.css" />
	<link rel="stylesheet" type="text/css" href="css/configScreen.css" />
	<script type="module" src="js/main.js"></script>
</head>
<body>
	<div id="startScreen">
		<div>
			<label id="startScreenMsg"></label>
			<input type="number" step="1" name="clientID" placeholder="ID" />
			<button id="connectBt">Connect</button>
		</div>
	</div>
	<main>
		<div id="stimScreen">
			<div id="topBar">
				<button>Reset VR view</button>
				<button id="configEditorBt">Configs</button>
			</div>
			<div id="eyes">
				<img class="eye" src="" />
				<img class="eye" src="" />
			</div>
			<img id="stream" src="" />
			
			<progress value="0" max="1"></progress>
			<div id="stimControls">
				<button id="start">Start</button>
				<button id="stop">Stop</button>
				<button id="reset">Reset</button>
			</div>
		</div>
		
		<div id="configScreen">
			<select id="configs_select"></select>
			<div id="config"></div>
		</div>
	</main>
</body>
</html>
