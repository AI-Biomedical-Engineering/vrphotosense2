<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Control vrphotosense2 stimulation and define stimulation procedures." />
	<title>vrphotosense2</title>

	<link rel="stylesheet" type="text/css" href="css/style.css" />
	<link rel="stylesheet" type="text/css" href="css/stimApp.css" />
	<link rel="stylesheet" type="text/css" href="css/dialog.css" />
	<link rel="stylesheet" type="text/css" href="css/configSelector.css" />
	<link rel="stylesheet" type="text/css" href="css/fileSelector.css" />
	<link rel="stylesheet" type="text/css" href="css/startScreen.css" />
	<link rel="stylesheet" type="text/css" href="css/stimScreen.css" />
	<link rel="stylesheet" type="text/css" href="css/configScreen.css" />
	<script type="module" src="js/main.js"></script>
</head>
<body>
	<div id="startScreen" class="visible">
		<div id="startBtFrame">
			<button id="startBt" class="action">Start</button>
		</div>
		<div id="configFolderFrame">
			<span>To continue, it is required to configure a local folder<br />where all files related to the app will be saved</span>
			<button id="configFolderBt" class="action">Select folder</button>
		</div>
		<div id="connectFrame">
			<span id="connectMsg"></span>
			<div>
				<img src="img/loadingIcon.png" alt="Loading" />
				<button id="cancelConnectBt">Cancel</button>
			</div>
		</div>
		<div id="askForIdFrame">
			<div>
				<span>App: #</span>
				<input type="number" step="1" name="clientID" />
			</div>
			<button id="connectBt" class="action">Connect</button>
		</div>
	</div>
	<main>
		<div id="stimScreen">
			<div id="topBar">
				<button>Reset VR view</button>
			</div>
			<div id="eyes">
				<img class="eye visible" src="" alt="Eye preview" />
				<img class="eye visible" src="" alt="Eye preview" />
			</div>
			<img id="stream" src="" alt="Stimulation preview" />
			
			<div id="progressContainer">
				<progress value="0" max="1"></progress>
			</div>
			<div id="stimControls">
				<button id="skipPrev"><img src="img/controlIcons/skipNext.svg" class="xflipped" alt="Skip previous" /></button>
				<button id="stop"><img src="img/controlIcons/stop.svg" alt="Stop" /></button>
				<button id="playPause">
					<img id="playImg" src="img/controlIcons/play.svg" alt="Play" />
					<img id="pauseImg" src="img/controlIcons/pause.svg" alt="Pause" />
				</button>
				<button id="skipNext"><img src="img/controlIcons/skipNext.svg" alt="Skip next" /></button>
				<button id="loopMode"><img src="img/controlIcons/loop.svg" class="invertOnSelected" alt="Loop mode" /></button>
			</div>
			
			<div id="configSelector">
				<div id="configGroups"></div>
				<div id="configNames"></div>
				<button id="addConfigBt"><img src="img/fileIcons/add.svg" alt="Add config" /></button>
			</div>
		</div>
		
		<div id="configScreen">
			<div id="configControls">
				<button id="cancelBt">Cancel</button>
				<button id="saveBt">Save & Exit</button>
			</div>
			<div id="configTypeSelector"></div>
			<div id="config"></div>
		</div>
	</main>
</body>
</html>
